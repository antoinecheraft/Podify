// ---------- COVER EDITOR ----------
const PAL=['#696969','#A9A9A9','#008BCD','#72BED9','#678F2E','#ACBA58','#B81A7B','#DC69A0','#996025','#D2A444','#D9D9D9'],CELL=477/22;
const EC={mix:false,tool:'move',px:new Array(484).fill(null),imgs:[],sel:-1,text:'',pc:10,tc:10,dirty:false,hist:[],tsize:40};
const edCells=[];for(let i=0;i<484;i++)edCells.push(mk('rect',{x:64+(i%22)*CELL,y:300+Math.floor(i/22)*CELL,width:CELL+.6,height:CELL+.6,fill:'none'},$('edPx')));
const edIn=document.createElement('input');edIn.type='file';edIn.accept='image/*';edIn.hidden=true;document.body.appendChild(edIn);
const edSnap=()=>JSON.stringify({px:EC.px,imgs:EC.imgs,text:EC.text});
function edPush(){EC.dirty=true;EC.hist.push(edSnap());if(EC.hist.length>80)EC.hist.shift()}
function edRestore(s){const o=JSON.parse(s);EC.px=o.px;EC.imgs=o.imgs;EC.text=o.text;if(EC.sel>=EC.imgs.length)EC.sel=-1;ed.value=EC.text;edRender()}
function edRender(){
 EC.px.forEach((c,i)=>edCells[i].setAttribute('fill',c||'none'));
 const g=$('edImgs');g.textContent='';EC.imgs.forEach(im=>mk('image',{href:im.u,x:64+im.x*CELL,y:300+im.y*CELL,width:im.w*CELL,height:im.h*CELL,preserveAspectRatio:'none'},g));
 const hs=$('edHs');hs.textContent='';
 if(EC.sel>=0&&EC.tool==='move'){const im=EC.imgs[EC.sel];[[0,0],[1,0],[0,1],[1,1]].forEach(([a,b])=>mk('rect',{class:'dark',x:64+(im.x+a*im.w)*CELL-11,y:300+(im.y+b*im.h)*CELL-11,width:22,height:22},hs))}
 const t=$('edT');t.textContent=EC.text;t.style.fill=PAL[EC.tc];t.style.fontSize='40px';const L=t.getComputedTextLength();EC.tsize=L>440?40*440/L:40;t.style.fontSize=EC.tsize+'px';
 const c=$('edC');if(state==='ed'&&EC.tool==='text'){c.style.display='';c.setAttribute('x',511);c.setAttribute('y',756);c.style.fill=PAL[EC.tc]}else c.style.display='none';
 [['icPen','pencil'],['icEra','eraser'],['icTxt','text']].forEach(([id,tl])=>$(id).setAttribute('class','ic'+(EC.tool===tl?' on':'')));
 $('edTc').querySelectorAll('rect').forEach(r=>r.setAttribute('fill',PAL[EC.tc]));$('edPcb').setAttribute('fill',PAL[EC.pc])}
function edSet(cx,cy,col){if(cx<0||cy<0||cx>21||cy>21)return;const i=cy*22+cx;if(EC.px[i]!==col){EC.px[i]=col;edCells[i].setAttribute('fill',col||'none')}}
function edLine(x0,y0,x1,y1,col){const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx-dy;for(;;){edSet(x0,y0,col);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>-dy){e-=dy;x0+=sx}if(e2<dx){e+=dx;y0+=sy}}}
const cvp=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform($('edCv').getScreenCTM().inverse());return{x:(q.x-64)/CELL,y:(q.y-300)/CELL}};
let edDr=null;const edCv=$('edCv');
edCv.addEventListener('pointerdown',e=>{if(state!=='ed')return;e.preventDefault();edCv.setPointerCapture(e.pointerId);const c=cvp(e),cx=Math.floor(c.x),cy=Math.floor(c.y);
 if(EC.tool==='pencil'||EC.tool==='eraser'){edPush();edDr={k:'draw',lx:cx,ly:cy};edSet(cx,cy,EC.tool==='pencil'?PAL[EC.pc]:null)}
 else if(EC.tool==='move'){
  if(EC.sel>=0){const im=EC.imgs[EC.sel];for(const [a,b] of [[0,0],[1,0],[0,1],[1,1]]){const hx=im.x+a*im.w,hy=im.y+b*im.h;if(Math.abs(c.x-hx)<=.9&&Math.abs(c.y-hy)<=.9){edDr={k:'size',ax:im.x+(1-a)*im.w,ay:im.y+(1-b)*im.h,im,pushed:false};return}}}
  let hit=-1;for(let i=EC.imgs.length-1;i>=0;i--){const im=EC.imgs[i];if(c.x>=im.x&&c.x<im.x+im.w&&c.y>=im.y&&c.y<im.y+im.h){hit=i;break}}
  EC.sel=hit;edRender();if(hit>=0){const im=EC.imgs[hit];edDr={k:'move',im,sx:c.x,sy:c.y,ox:im.x,oy:im.y,pushed:false}}}});
edCv.addEventListener('pointermove',e=>{if(!edDr)return;const c=cvp(e),D=edDr;
 if(D.k==='draw'){const cx=Math.floor(c.x),cy=Math.floor(c.y);if(cx!==D.lx||cy!==D.ly){edLine(D.lx,D.ly,cx,cy,EC.tool==='pencil'?PAL[EC.pc]:null);D.lx=cx;D.ly=cy}}
 else if(D.k==='move'){const nx=D.ox+Math.round(c.x-D.sx),ny=D.oy+Math.round(c.y-D.sy);if(nx!==D.im.x||ny!==D.im.y){if(!D.pushed){edPush();D.pushed=true}D.im.x=nx;D.im.y=ny;edRender()}}
 else{const im=D.im,w=Math.max(1,Math.round(Math.abs(c.x-D.ax))),h=Math.max(1,Math.round(w*im.ar)),x=c.x>=D.ax?D.ax:D.ax-w,y=c.y>=D.ay?D.ay:D.ay-h;if(w!==im.w||h!==im.h||x!==im.x||y!==im.y){if(!D.pushed){edPush();D.pushed=true}im.w=w;im.h=h;im.x=x;im.y=y;edRender()}}});
['pointerup','pointercancel'].forEach(n=>edCv.addEventListener(n,()=>{edDr=null}));
const edTool=t=>{if(state!=='ed')return;const was=EC.tool;EC.tool=was===t?'move':t;if(was==='text')ed.blur();if(EC.tool==='text'){edPush();ed.value=EC.text;ed.focus({preventScroll:true});ed.setSelectionRange(ed.value.length,ed.value.length)}edRender()};
$('hPen').onclick=()=>edTool('pencil');$('hEra').onclick=()=>edTool('eraser');$('hTxt').onclick=()=>edTool('text');
$('hTc').onclick=()=>{if(state==='ed'){EC.tc=(EC.tc+1)%PAL.length;edRender()}};$('hPc').onclick=()=>{if(state==='ed'){EC.pc=(EC.pc+1)%PAL.length;edRender()}};
$('hUnd').onclick=()=>{if(state!=='ed')return;const s=EC.hist.pop();if(s)edRestore(s)};
$('hRes').onclick=()=>{if(state!=='ed')return;edPush();EC.px.fill(null);EC.imgs=[];EC.sel=-1;EC.text='';ed.value='';edRender()};
$('hUpl').onclick=()=>{if(state==='ed')edIn.click()};
edIn.onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||state!=='ed')return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{edPush();EC.imgs.push(fitImg(u,im));EC.sel=EC.imgs.length-1;EC.tool='move';edRender()};im.src=u};
ed.addEventListener('input',()=>{if(state==='ed'&&EC.tool==='text'){EC.dirty=true;EC.text=ed.value.slice(0,40);edRender()}});
ed.addEventListener('keydown',e=>{if(state==='ed'&&EC.tool==='text'&&e.key==='Enter'){e.preventDefault();EC.tool='move';ed.blur();edRender()}});
function fitImg(u,im){const ar=im.naturalHeight/im.naturalWidth;let w=22,h=Math.round(22*ar);if(h>22){h=22;w=Math.max(1,Math.round(22/ar))}h=Math.max(1,h);return{u,x:Math.floor((22-w)/2),y:Math.floor((22-h)/2),w,h,ar}}
const loadImg=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u});
async function edExport(){const S=48,N=22,c=document.createElement('canvas');c.width=c.height=S*N;const x=c.getContext('2d');x.fillStyle='#D9D9D9';x.fillRect(0,0,c.width,c.height);
 for(const im of EC.imgs){const el=await loadImg(im.u);if(el)x.drawImage(el,im.x*S,im.y*S,im.w*S,im.h*S)}
 EC.px.forEach((col,i)=>{if(col){x.fillStyle=col;x.fillRect((i%N)*S,Math.floor(i/N)*S,S,S)}});
 if(EC.text){const k=S*N/477;x.fillStyle=PAL[EC.tc];x.font='700 '+(EC.tsize*k)+'px "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif';x.textAlign='right';x.textBaseline='alphabetic';x.fillText(EC.text,(511-64)*k,(748-300)*k)}
 return new Promise(r=>c.toBlob(r,'image/jpeg',.93))}
function openEditor(){if(state!=='p3'&&state!=='m6')return;const m=state==='m6',X=m?'mxe':'wxe';
 EC.mix=m;EC.px.fill(null);EC.imgs=[];EC.sel=-1;EC.text='';EC.tool='move';EC.hist=[];EC.pc=10;EC.tc=10;EC.dirty=false;$('edWrap').setAttribute('transform',m?'translate(475,0)':'');
 const cur=m?tracks[ci()].cover:A.cover;if(cur)loadImg(cur).then(el=>{if(el&&state!=='p3'&&state!=='m6'&&!EC.imgs.length&&!EC.dirty){EC.imgs=[fitImg(cur,el)];EC.sel=0;edRender()}});
 au.pause();pvWant=false;syncInd();ed.blur();state='tred';svg.classList.add('ed',X);
 setTimeout(()=>{svg.classList.add('edi','h3e');svg.classList.remove(X);state='ed';edRender()},1500)}
function applyCover(u,size){if(EC.mix){const ts_=M.sameCover?tracks:[tracks[ci()]];ts_.forEach(t=>{t.cover=u;t.csz=size});renderHeadM()}else{A.cover=u;renderCover()}}
async function closeEditor(){if(state!=='ed')return;state='tred';const m=EC.mix,X=m?'mxe':'wxe';EC.tool='move';ed.blur();edRender();
 if(EC.dirty){try{const b=await edExport();applyCover(URL.createObjectURL(b),b.size)}catch(e){}}
 quick();svg.classList.remove('ed','edi');svg.classList.add(X,'edo');
 setTimeout(()=>svg.classList.remove('edo'),1300);setTimeout(()=>svg.classList.remove(X,'h3e'),1700);setTimeout(()=>state=m?'m6':'p3',3700)}
$('hitEdA').onclick=$('hitEdM').onclick=closeEditor;
$('hDl').onclick=async()=>{if(state!=='ed')return;const b=await edExport(),name=(EC.mix?'Mix':safe(A.title))+' - Cover.jpg';
 try{const dl=typeof claude!=='undefined'&&claude.use?await claude.use('downloads'):null;if(dl)await dl.save({filename:name,data:b});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}}
 catch(e){toast(e&&e.code==='declined'?'Download cancelled':'Download unavailable')}};
$('hitPen').onclick=()=>{if(state==='p3')openEditor()};$('hPenM').onclick=()=>{if(state==='m6')openEditor()};

// ---------- EASTER EGG : hidden PODIFY logo on the wheel ----------
(()=>{const egg=$('egg'),wh0=$('wheelIntro'),ring=wh0.querySelector('path.panel');let rot=0,dr=null,vel=0,raf=0,rt=0;
 ring.style.touchAction='none';ring.style.cursor='grab';
 const ang=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(wh0.getScreenCTM().inverse());return Math.atan2(q.y,q.x-540)*180/Math.PI};
 const put=()=>{egg.style.transform='rotate('+rot+'deg)'};
 ring.addEventListener('pointerdown',e=>{if(state!=='home'||svg.classList.contains('intro'))return;e.preventDefault();ring.setPointerCapture(e.pointerId);cancelAnimationFrame(raf);clearTimeout(rt);egg.style.transition='none';const a=ang(e);dr={la:a,t:performance.now()};vel=0;ring.style.cursor='grabbing'});
 ring.addEventListener('pointermove',e=>{if(!dr)return;const a=ang(e);let d=a-dr.la;if(d>180)d-=360;if(d<-180)d+=360;const now=performance.now(),dt=Math.max(1,now-dr.t);vel=.7*vel+.3*(d/dt);rot+=d;dr.la=a;dr.t=now;put()});
 const end=()=>{if(!dr)return;dr=null;ring.style.cursor='grab';const step=()=>{if(Math.abs(vel)<.01||state!=='home')return;rot+=vel*16;vel*=.94;put();raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)};
 ring.addEventListener('pointerup',end);ring.addEventListener('pointercancel',end);
 setInterval(()=>{if(state!=='home'&&state!=='tr'&&rot!==0&&!dr){cancelAnimationFrame(raf);const t=Math.round(rot/360)*360;rot=0;egg.style.transition='transform .6s cubic-bezier(.32,.72,0,1)';egg.style.transform='rotate('+t+'deg)';rt=setTimeout(()=>{egg.style.transition='none';egg.style.transform=''},700)}},120);
})();
